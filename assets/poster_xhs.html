<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
body{width:1080px;height:1440px;background:linear-gradient(170deg,#FAFAF9 0%,#FFF7ED 100%);display:flex;flex-direction:column;padding:48px 60px;position:relative;overflow:hidden}
.deco{position:absolute;border-radius:50%;opacity:.5}
.d1{width:420px;height:420px;background:#FFE8D6;top:-160px;right:-140px}
.d2{width:260px;height:260px;background:#FFE3C8;bottom:-90px;left:-70px}
.top{position:relative;display:flex;align-items:center;gap:28px}
.logo{width:100px;height:100px}
.brand h1{font-size:70px;font-weight:800;color:#1C1917}
.brand h1 span{color:#EA580C}
.brand .slogan{font-size:28px;color:#57534E;margin-top:6px}
.quote{position:relative;margin:28px 0 26px}
.quote p{font-size:36px;line-height:1.62;color:#1C1917;font-weight:700}
.quote p em{font-style:normal;color:#EA580C}
.shot{position:relative;background:#fff;border:1px solid #E7E5E4;border-radius:22px;padding:14px;box-shadow:0 8px 28px rgba(28,25,23,.10)}
.shot img{width:100%;max-height:470px;object-fit:cover;object-position:top;border-radius:12px;display:block}
.points{position:relative;margin-top:30px;display:flex;flex-direction:column;gap:14px}
.pt{background:rgba(255,255,255,.85);border:1px solid #E7E5E4;border-radius:16px;padding:18px 28px;display:flex;align-items:center;gap:18px}
.pt .ico{font-size:36px}
.pt .tx b{font-size:30px;color:#1C1917;display:block}
.pt .tx i{font-style:normal;font-size:24px;color:#78716C}
.footer{position:relative;margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
.tags{font-size:24px;color:#EA580C;font-weight:600;line-height:1.7}
.online{font-size:38px;font-weight:800;color:#1C1917}
.online b{color:#EA580C}
</style></head><body>
<div class="deco d1"></div><div class="deco d2"></div>
<div class="top">
  <img class="logo" src="logo.png">
  <div class="brand">
    <h1>托摆<span>。</span></h1>
    <div class="slogan">把技能托付给 AI，替你摆到路边去</div>
  </div>
</div>
<div class="quote">
  <p>县城的摩托车师傅，<br>把车开出来就开张了。<br>你的技能，<em>也该摆到路边去。</em></p>
</div>
<div class="shot">
  <img src="shot_result.png">
</div>
<div class="points">
  <div class="pt"><div class="ico">🐟</div><div class="tx"><b>2 分钟上架闲鱼</b><i>一句话 → 定价/文案/主图 → 真实在售</i></div></div>
  <div class="pt"><div class="ico">🤖</div><div class="tx"><b>你的 AI agent 替你经营</b><i>记账 · 商机 · 日志，全 CLI 化</i></div></div>
  <div class="pt"><div class="ico">🚪</div><div class="tx"><b>从开张到关张</b><i>干不下去还能一键清算、写简历找工作</i></div></div>
</div>
<div class="footer">
  <div class="tags">#WaytoAGI #1024超能Coding周末<br>#AI切磋大会 #一人公司</div>
  <div class="online">阿托，<b>永远在线</b>。</div>
</div>
</body></html>
