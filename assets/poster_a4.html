<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
body{width:1587px;height:2245px;background:#FAFAF9;display:flex;flex-direction:column;padding:90px 100px;position:relative}
.top{display:flex;align-items:center;gap:44px}
.logo{width:210px;height:210px}
.brand h1{font-size:120px;font-weight:800;color:#1C1917;letter-spacing:4px}
.brand h1 span{color:#EA580C}
.brand .slogan{font-size:44px;color:#57534E;margin-top:14px;letter-spacing:2px}
.quote{margin:70px 0 60px;border-left:14px solid #EA580C;background:#FFF7ED;padding:44px 54px;border-radius:0 20px 20px 0}
.quote p{font-size:42px;line-height:1.7;color:#1C1917;font-weight:600}
.quote p em{font-style:normal;color:#EA580C}
.shot{background:#fff;border:1px solid #E7E5E4;border-radius:24px;padding:26px;box-shadow:0 8px 32px rgba(28,25,23,.08)}
.shot img{width:100%;border-radius:14px;display:block}
.shot .cap{font-size:30px;color:#78716C;text-align:center;margin-top:18px}
.flow{display:flex;align-items:center;justify-content:space-between;margin:60px 0;background:#1C1917;border-radius:24px;padding:44px 60px}
.flow .step{text-align:center;color:#D6D3D1}
.flow .step b{display:block;font-size:40px;color:#fff;margin-bottom:8px}
.flow .step i{font-style:normal;font-size:28px}
.flow .arrow{font-size:52px;color:#EA580C}
.real{display:flex;align-items:center;gap:24px;margin-bottom:56px}
.real .tag{background:#EA580C;color:#fff;font-size:30px;font-weight:700;padding:12px 30px;border-radius:999px}
.real p{font-size:34px;color:#1C1917}
.real p span{color:#EA580C;font-weight:700}
.footer{margin-top:auto;border-top:1px solid #E7E5E4;padding-top:36px;display:flex;justify-content:space-between;align-items:center}
.footer .who{font-size:30px;color:#78716C}
.footer .online{font-size:36px;font-weight:800;color:#1C1917}
.footer .online b{color:#EA580C}
</style></head><body>
<div class="top">
  <img class="logo" src="logo.png">
  <div class="brand">
    <h1>托摆<span>。</span></h1>
    <div class="slogan">把技能托付给 AI，替你摆到路边去</div>
  </div>
</div>
<div class="quote">
  <p>每个县城都有一个摩托车师傅——把车开出来，往路边一停，就开张了。<br>
  可是在网上，一个人的技能却锁在聊天记录里，<em>孤芳自赏最心痛。</em></p>
</div>
<div class="shot">
  <img src="shot_result.png">
  <div class="cap">一句话技能 → 2 分钟 → 全套开张装备（定价/文案/主图/话术），闲鱼真实在售</div>
</div>
<div class="flow">
  <div class="step"><b>💬 一句话</b><i>说清技能</i></div><div class="arrow">→</div>
  <div class="step"><b>📦 全套装备</b><i>定价·文案·主图</i></div><div class="arrow">→</div>
  <div class="step"><b>🐟 真实上架</b><i>闲鱼在售</i></div><div class="arrow">→</div>
  <div class="step"><b>🤖 agent 同款</b><i>记账·商机·日志全 CLI</i></div>
</div>
<div class="real">
  <div class="tag">真实成交</div>
  <p>已用托摆真实上架闲鱼 ¥69 定制服务 · <span>从开张到关张，托摆陪你走完全程</span></p>
</div>
<div class="footer">
  <div class="who">WaytoAGI 1024 超能 Coding 周末 · OPC 赛道</div>
  <div class="online">阿托，<b>永远在线</b>。</div>
</div>
</body></html>
